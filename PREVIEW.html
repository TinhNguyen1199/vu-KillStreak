<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>KillStreak UI Preview — NEW DESIGN</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0d1117;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
    user-select: none;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 25% 65%, rgba(30,55,80,0.5) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 25%, rgba(70,35,15,0.4) 0%, transparent 50%),
        linear-gradient(180deg, #0d1117 0%, #151e2a 50%, #0d1520 100%);
    z-index: -1;
}

/* ── Control panel ── */
#controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 9999;
    background: rgba(0,0,0,0.88);
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    max-width: 96vw;
}

.btn {
    display: block;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    letter-spacing: 0.8px;
    cursor: pointer;
    border: none;
    border-radius: 3px;
    text-transform: uppercase;
}
.btn:hover { opacity: 0.8; }
.btn-orange { background: #bb3d00; color: #fff; }
.btn-red    { background: #990000; color: #fff; }
.btn-purple { background: #5500aa; color: #fff; }
.btn-blue   { background: #004499; color: #fff; }
.btn-gray   { background: #3a3a3a; color: #ccc; }
.btn-gold   { background: #775500; color: #fff; }
.btn-teal   { background: #006655; color: #fff; }
.btn-label  { background: transparent; color: #555; cursor: default; font-size: 10px; padding: 6px 4px; }

/* ── Utility ── */
.hidden { display: none !important; }

@keyframes fadeOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
}

/* ============================================================
   1. KILL COUNTER — accent bar trái, layout sạch hơn
   ============================================================ */
#kill-counter {
    position: fixed;
    top: 28px;
    left: 28px;
    display: flex;
    align-items: stretch;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,80,0,0.4);
    border-radius: 4px;
    overflow: hidden;
}

#kill-accent-bar {
    display: block;
    width: 4px;
    background: linear-gradient(180deg, #ff6600 0%, #cc2200 100%);
    flex-shrink: 0;
}

#kill-inner {
    display: block;
    padding: 6px 14px 6px 10px;
}

#kill-icon {
    display: block;
    font-size: 10px;
    font-family: Arial, sans-serif;
    font-weight: normal;
    letter-spacing: 3px;
    color: rgba(255,120,60,0.7);
    text-transform: uppercase;
    margin-bottom: 2px;
}

#kill-number {
    display: block;
    font-size: 30px;
    font-weight: 900;
    color: #ff6600;
    text-shadow: 0 0 10px rgba(255,80,0,0.7), 0 0 22px rgba(255,60,0,0.35);
    line-height: 1;
}

/* ── Streak Progress ── */
#streak-progress {
    position: fixed;
    top: 90px;
    left: 28px;
}

#progress-text {
    display: block;
    font-size: 12px;
    font-family: Arial, sans-serif;
    font-weight: normal;
    color: #ffaa66;
    text-shadow: 1px 1px 0 #000;
    letter-spacing: 1px;
    opacity: 0.82;
}

/* ============================================================
   2. STREAK MESSAGE — panel với border-color per streak
   ============================================================ */
#streak-message {
    position: fixed;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
}

#streak-panel {
    display: block;
    padding: 14px 44px 16px;
    background: rgba(0,0,0,0.80);
    border-top: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
}

#streak-name {
    display: block;
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 7px;
    text-transform: uppercase;
    line-height: 1;
}

#streak-divider {
    display: block;
    height: 1px;
    background: currentColor;
    opacity: 0.3;
    margin: 9px auto;
    width: 55%;
}

#streak-kills {
    display: block;
    font-size: 14px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
}

/* Per-streak: color cascades xuống panel via currentColor */
.sk-killingspree #streak-panel { color: #ffaa00; }
.sk-killingspree #streak-name {
    color: #ffaa00;
    text-shadow: 0 0 14px #ff8800, 0 0 36px rgba(255,120,0,0.45), 2px 2px 0 #000;
}
.sk-rampage #streak-panel { color: #ff6600; }
.sk-rampage #streak-name {
    color: #ff6600;
    text-shadow: 0 0 14px #ff4400, 0 0 38px rgba(220,50,0,0.5), 2px 2px 0 #000;
}
.sk-dominating #streak-panel { color: #ff3300; }
.sk-dominating #streak-name {
    color: #ff3300;
    text-shadow: 0 0 16px #ff1100, 0 0 42px rgba(200,0,0,0.55), 2px 2px 0 #000;
}
.sk-unstoppable #streak-panel { color: #cc44ff; }
.sk-unstoppable #streak-name {
    color: #cc44ff;
    text-shadow: 0 0 16px #aa00ff, 0 0 44px rgba(120,0,220,0.55), 2px 2px 0 #000;
}
.sk-godlike #streak-panel { color: #ffe040; }
.sk-godlike #streak-name {
    color: #ffffff;
    text-shadow:
        0 0 18px #ffee00,
        0 0 48px rgba(255,210,0,0.65),
        0 0 70px rgba(255,160,0,0.35),
        2px 2px 0 #000;
}

@keyframes streakSlideIn {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-22px) scaleY(0.78); }
    10%  { opacity: 1; transform: translateX(-50%) translateY(3px)   scaleY(1.05); }
    18%  { transform: translateX(-50%) translateY(0) scaleY(1); }
    72%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(0) scaleY(1); }
}
.streak-animate { animation: streakSlideIn 3.0s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ============================================================
   3. MULTI-KILL — ribbon với colored border
   ============================================================ */
#multikill-badge {
    position: fixed;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
}

#multikill-ribbon {
    display: block;
    padding: 10px 56px;
    background: rgba(0,0,0,0.82);
    position: relative;
}

/* top / bottom lines via pseudo */
#multikill-ribbon::before,
#multikill-ribbon::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
}
#multikill-ribbon::before { top: 0; }
#multikill-ribbon::after  { bottom: 0; }

#multikill-name {
    display: block;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
}

.mk-double #multikill-ribbon { border-left: 3px solid #ffdd00; border-right: 3px solid #ffdd00; }
.mk-double #multikill-ribbon::before,
.mk-double #multikill-ribbon::after { background: #ffdd00; }
.mk-double #multikill-name {
    font-size: 36px;
    color: #ffdd00;
    text-shadow: 0 0 12px #ffaa00, 0 0 28px rgba(255,160,0,0.45), 2px 2px 0 #000;
}

.mk-triple #multikill-ribbon { border-left: 3px solid #ff8800; border-right: 3px solid #ff8800; }
.mk-triple #multikill-ribbon::before,
.mk-triple #multikill-ribbon::after { background: #ff8800; }
.mk-triple #multikill-name {
    font-size: 42px;
    color: #ff8800;
    text-shadow: 0 0 14px #ff6600, 0 0 34px rgba(255,100,0,0.5), 2px 2px 0 #000;
}

.mk-quad #multikill-ribbon { border-left: 3px solid #ff3300; border-right: 3px solid #ff3300; }
.mk-quad #multikill-ribbon::before,
.mk-quad #multikill-ribbon::after { background: #ff3300; }
.mk-quad #multikill-name {
    font-size: 48px;
    color: #ff3300;
    text-shadow: 0 0 16px #ff1100, 0 0 40px rgba(200,0,0,0.55), 2px 2px 0 #000;
}

.mk-rampage #multikill-ribbon { border-left: 3px solid #cc44ff; border-right: 3px solid #cc44ff; }
.mk-rampage #multikill-ribbon::before,
.mk-rampage #multikill-ribbon::after { background: #cc44ff; }
.mk-rampage #multikill-name {
    font-size: 54px;
    color: #cc44ff;
    text-shadow: 0 0 18px #aa00ff, 0 0 46px rgba(140,0,240,0.55), 2px 2px 0 #000;
}

@keyframes ribbonPop {
    0%   { transform: translateX(-50%) scaleX(0.15) scaleY(0.7); opacity: 0; }
    12%  { transform: translateX(-50%) scaleX(1.06) scaleY(1.04); opacity: 1; }
    22%  { transform: translateX(-50%) scaleX(1) scaleY(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scaleX(1) scaleY(1); }
}
.multikill-animate { animation: ribbonPop 2.6s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ============================================================
   4. HEADSHOT — gộp icon + text, slide từ phải
   ============================================================ */
#headshot-badge {
    position: fixed;
    top: 17%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    background: rgba(0,0,0,0.68);
    padding: 8px 20px 8px 14px;
    border-left: 3px solid #ff2222;
}

.headshot-icon-fallback {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(180,0,0,0.22);
    border: 2px solid #ff2222;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff5555;
    font-size: 18px;
    font-weight: 900;
    filter: drop-shadow(0 0 6px rgba(255,0,0,0.6));
    flex-shrink: 0;
}

#headshot-label { display: block; }

#headshot-name {
    display: block;
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 10px #ff4444, 0 0 24px rgba(200,0,0,0.45), 2px 2px 0 #000;
    letter-spacing: 3px;
    text-transform: uppercase;
}

#headshot-count {
    display: block;
    font-size: 12px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: rgba(255,110,110,0.82);
    letter-spacing: 2px;
    margin-top: 3px;
}

@keyframes headshotSlide {
    0%   { transform: translateX(calc(-50% + 30px)); opacity: 0; }
    10%  { transform: translateX(-52%); opacity: 1; }
    16%  { transform: translateX(-50%); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%); }
}
.headshot-animate { animation: headshotSlide 2.2s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ============================================================
   5. STREAK ENDED — panel + border, lebih besar
   ============================================================ */
#streak-ended {
    position: fixed;
    top: 38%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
}

#ended-panel {
    display: block;
    padding: 12px 38px;
    background: rgba(0,0,0,0.76);
}

#ended-text {
    display: block;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
}

#ended-count {
    display: block;
    font-size: 15px;
    font-family: Arial, sans-serif;
    letter-spacing: 2px;
    margin-top: 4px;
    opacity: 0.82;
}

.ended-by-player #ended-panel { border-top: 2px solid #ff4444; border-bottom: 2px solid #ff4444; }
.ended-by-player #ended-text  { color: #ff4444; text-shadow: 0 0 12px rgba(200,0,0,0.6), 2px 2px 0 #000; }
.ended-by-player #ended-count { color: #ff8888; text-shadow: 1px 1px 0 #000; }

.ended-env #ended-panel { border-top: 2px solid #666; border-bottom: 2px solid #666; }
.ended-env #ended-text  { color: #aaaaaa; text-shadow: 1px 1px 0 #000; }
.ended-env #ended-count { color: #666; text-shadow: 1px 1px 0 #000; }

@keyframes endedFadeIn {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.82); }
    12%  { opacity: 1; transform: translateX(-50%) scale(1.06); }
    22%  { transform: translateX(-50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.ended-animate { animation: endedFadeIn 2.2s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ============================================================
   6. SERVER ANNOUNCE — panel + separator + blue border
   ============================================================ */
#server-announce {
    position: fixed;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
    background: rgba(0,0,0,0.80);
    border-top: 2px solid #0088ff;
    border-bottom: 2px solid #0088ff;
    padding: 12px 44px;
}

#announce-name {
    display: block;
    font-size: 20px;
    font-weight: 900;
    color: #66ccff;
    text-shadow: 0 0 10px #0088ff, 2px 2px 0 #000;
    letter-spacing: 4px;
    text-transform: uppercase;
}

#announce-separator {
    display: block;
    height: 1px;
    background: rgba(0,136,255,0.3);
    margin: 7px auto;
    width: 75%;
}

#announce-streak {
    display: block;
    font-size: 36px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 12px #0088ff, 0 0 30px rgba(0,80,200,0.45), 2px 2px 0 #000;
    letter-spacing: 4px;
    text-transform: uppercase;
}

#announce-kills {
    display: block;
    font-size: 13px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #99ddff;
    text-shadow: 1px 1px 0 #000;
    margin-top: 5px;
    letter-spacing: 3px;
}

@keyframes announcePop {
    0%   { transform: translateX(-50%) scale(0.72); opacity: 0; }
    10%  { transform: translateX(-50%) scale(1.04); opacity: 1; }
    20%  { transform: translateX(-50%) scale(1); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.announce-animate { animation: announcePop 3.5s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ============================================================
   7. REVENGE — panel + orange border
   ============================================================ */
#revenge-badge {
    position: fixed;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
    background: rgba(0,0,0,0.76);
    border-top: 2px solid #ff6600;
    border-bottom: 2px solid #ff6600;
    padding: 10px 48px;
}

#revenge-text {
    display: block;
    font-size: 50px;
    font-weight: 900;
    color: #ff6600;
    text-shadow: 0 0 14px #ff4400, 0 0 38px rgba(220,60,0,0.45), 2px 2px 0 #000;
    letter-spacing: 8px;
    text-transform: uppercase;
}

@keyframes revengePop {
    0%   { transform: translateX(-50%) scale(0.45); opacity: 0; }
    10%  { transform: translateX(-50%) scale(1.12); opacity: 1; }
    20%  { transform: translateX(-50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.revenge-animate { animation: revengePop 2.6s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ============================================================
   8. FIRST BLOOD — panel + red border
   ============================================================ */
#firstblood-badge {
    position: fixed;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
    background: rgba(0,0,0,0.76);
    border-top: 2px solid #ff2222;
    border-bottom: 2px solid #ff2222;
    padding: 10px 48px;
}

#firstblood-text {
    display: block;
    font-size: 50px;
    font-weight: 900;
    color: #ff2222;
    text-shadow: 0 0 14px #ff0000, 0 0 40px rgba(180,0,0,0.55), 2px 2px 0 #000;
    letter-spacing: 6px;
    text-transform: uppercase;
}

@keyframes firstBloodPop {
    0%   { transform: translateX(-50%) scale(0.45); opacity: 0; }
    10%  { transform: translateX(-50%) scale(1.14); opacity: 1; }
    20%  { transform: translateX(-50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.firstblood-animate { animation: firstBloodPop 2.6s cubic-bezier(0.22,1,0.36,1) forwards; }
</style>
</head>
<body>

<!-- Kill Counter -->
<div id="kill-counter">
    <div id="kill-accent-bar"></div>
    <div id="kill-inner">
        <div id="kill-icon">KILLS</div>
        <div id="kill-number">7</div>
    </div>
</div>
<div id="streak-progress">
    <div id="progress-text">3 kills → DOMINATING</div>
</div>

<!-- Streak Message -->
<div id="streak-message" class="hidden">
    <div id="streak-panel">
        <div id="streak-name">KILLING SPREE</div>
        <div id="streak-divider"></div>
        <div id="streak-kills">3 KILLS</div>
    </div>
</div>

<!-- Multi-Kill -->
<div id="multikill-badge" class="hidden mk-double">
    <div id="multikill-ribbon">
        <div id="multikill-name">DOUBLE KILL</div>
    </div>
</div>

<!-- Headshot (combined) -->
<div id="headshot-badge" class="hidden">
    <div class="headshot-icon-fallback">X</div>
    <div id="headshot-label">
        <div id="headshot-name">HEADSHOT</div>
        <div id="headshot-count">1x</div>
    </div>
</div>

<!-- Server Announce -->
<div id="server-announce" class="hidden">
    <div id="announce-name">Ghost</div>
    <div id="announce-separator"></div>
    <div id="announce-streak">IS DOMINATING!</div>
    <div id="announce-kills">10 KILLS</div>
</div>

<!-- Revenge -->
<div id="revenge-badge" class="hidden">
    <div id="revenge-text">REVENGE</div>
</div>

<!-- First Blood -->
<div id="firstblood-badge" class="hidden">
    <div id="firstblood-text">FIRST BLOOD</div>
</div>

<!-- Streak Ended -->
<div id="streak-ended" class="hidden">
    <div id="ended-panel">
        <div id="ended-text">STREAK ENDED</div>
        <div id="ended-count">by Sniper420 (7 kills)</div>
    </div>
</div>

<!-- Controls -->
<div id="controls">
    <span class="btn btn-label">STREAK</span>
    <button class="btn btn-orange" onclick="demoStreak('KILLING SPREE',3,'sk-killingspree')">Killing Spree</button>
    <button class="btn btn-orange" onclick="demoStreak('RAMPAGE',5,'sk-rampage')">Rampage</button>
    <button class="btn btn-red"    onclick="demoStreak('DOMINATING',7,'sk-dominating')">Dominating</button>
    <button class="btn btn-purple" onclick="demoStreak('UNSTOPPABLE',10,'sk-unstoppable')">Unstoppable</button>
    <button class="btn btn-gold"   onclick="demoStreak('GODLIKE',15,'sk-godlike')">Godlike</button>
    <span class="btn btn-label">MULTI</span>
    <button class="btn btn-gray"   onclick="demoMulti('DOUBLE KILL','mk-double')">Double</button>
    <button class="btn btn-gray"   onclick="demoMulti('TRIPLE KILL','mk-triple')">Triple</button>
    <button class="btn btn-gray"   onclick="demoMulti('QUAD KILL','mk-quad')">Quad</button>
    <button class="btn btn-purple" onclick="demoMulti('RAMPAGE','mk-rampage')">Rampage</button>
    <span class="btn btn-label">HS</span>
    <button class="btn btn-red"    onclick="demoHeadshot('HEADSHOT',1)">1x</button>
    <button class="btn btn-red"    onclick="demoHeadshot('DOUBLE HEADSHOT',2)">2x</button>
    <button class="btn btn-red"    onclick="demoHeadshot('TRIPLE HEADSHOT',3)">3x</button>
    <span class="btn btn-label">OTHER</span>
    <button class="btn btn-blue"   onclick="demoAnnounce('Ghost','DOMINATING',10)">Announce</button>
    <button class="btn btn-orange" onclick="demoRevenge()">Revenge</button>
    <button class="btn btn-red"    onclick="demoFirstBlood()">First Blood</button>
    <button class="btn btn-gray"   onclick="demoEnded(7,'Sniper420')">Ended (player)</button>
    <button class="btn btn-gray"   onclick="demoEnded(5,'')">Ended (env)</button>
    <button class="btn btn-teal"   onclick="cycleKillCounter()">Counter +1</button>
</div>

<script>
var _timers = {};

function clearAnimate(el, key) {
    el.classList.remove(
        'streak-animate','multikill-animate','headshot-animate',
        'ended-animate','announce-animate','revenge-animate','firstblood-animate'
    );
    if (_timers[key]) clearTimeout(_timers[key]);
}

function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

function demoStreak(name, kills, cls) {
    var el = document.getElementById('streak-message');
    clearAnimate(el, 'streak');
    el.className = cls;
    show(el);
    document.getElementById('streak-name').textContent  = name;
    document.getElementById('streak-kills').textContent = kills + ' KILLS';
    void el.offsetHeight;
    el.classList.add('streak-animate');
    _timers.streak = setTimeout(function() { hide(el); }, 3100);
}

function demoMulti(name, cls) {
    var el = document.getElementById('multikill-badge');
    clearAnimate(el, 'multi');
    el.className = cls;
    show(el);
    document.getElementById('multikill-name').textContent = name;
    void el.offsetHeight;
    el.classList.add('multikill-animate');
    _timers.multi = setTimeout(function() { hide(el); }, 2700);
}

function demoHeadshot(name, count) {
    var el = document.getElementById('headshot-badge');
    clearAnimate(el, 'headshot');
    show(el);
    document.getElementById('headshot-name').textContent  = name;
    document.getElementById('headshot-count').textContent = count + 'x';
    void el.offsetHeight;
    el.classList.add('headshot-animate');

}

function demoEnded(kills, killer) {
    var el = document.getElementById('streak-ended');
    clearAnimate(el, 'ended');
    el.className = killer ? 'ended-by-player' : 'ended-env';
    show(el);
    document.getElementById('ended-text').textContent = 'STREAK ENDED';
    if (killer) {
        document.getElementById('ended-count').textContent = 'by ' + killer + ' (' + kills + ' kills)';
    } else {
        document.getElementById('ended-count').textContent = kills + ' kill streak';
    }
    void el.offsetHeight;
    el.classList.add('ended-animate');
    _timers.ended = setTimeout(function() { hide(el); }, 2300);
}

var _kills = 7;
function cycleKillCounter() {
    _kills = (_kills >= 15) ? 1 : _kills + 1;
    document.getElementById('kill-number').textContent = _kills;
    var nextName = '', remaining = 0;
    if      (_kills < 3)  { remaining = 3  - _kills; nextName = 'KILLING SPREE'; }
    else if (_kills < 5)  { remaining = 5  - _kills; nextName = 'RAMPAGE';        }
    else if (_kills < 7)  { remaining = 7  - _kills; nextName = 'DOMINATING';     }
    else if (_kills < 10) { remaining = 10 - _kills; nextName = 'UNSTOPPABLE';    }
    else if (_kills < 15) { remaining = 15 - _kills; nextName = 'GODLIKE';        }
    var sp = document.getElementById('streak-progress');
    if (nextName) {
        document.getElementById('progress-text').textContent =
            remaining + ' kill' + (remaining > 1 ? 's' : '') + ' → ' + nextName;
        sp.classList.remove('hidden');
    } else {
        sp.classList.add('hidden');
    }
}
