<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KillStreak HUD — Preview</title>
    <style>
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="%23333" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="%231a1a1a"/><rect width="100" height="100" fill="url(%23grid)" /></svg>');
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Arial, sans-serif;
            user-select: none;
            position: relative;
        }

        /* Instruction panel */
        #instruction-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #666;
            padding: 12px 16px;
            font-size: 12px;
            color: #aaa;
            max-width: 300px;
            z-index: 10000;
            line-height: 1.5;
            font-family: monospace;
        }

        #instruction-panel strong {
            color: #fff;
            display: block;
            margin-bottom: 6px;
        }

        .demo-button {
            background: #0066ff;
            border: none;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            margin: 3px 0;
            font-size: 11px;
            border-radius: 2px;
            display: inline-block;
            width: 100%;
            margin-top: 6px;
        }

        .demo-button:hover {
            background: #0088ff;
        }

        .badge-new {
            display: inline-block;
            background: #ff6600;
            color: white;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 10px;
            margin-left: 5px;
            font-weight: bold;
        }

        /* ============== KS UI STYLING ============== */

        /* Kill Counter — góc trên trái */
        #kill-counter {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 60, 0, 0.6);
            border-radius: 4px;
            padding: 6px 12px;
            color: #ff6600;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 8px #ff4400;
            display: flex;
            align-items: center;
        }

        #kill-icon {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-right: 8px;
            letter-spacing: 1px;
        }

        #kill-number {
            display: block;
        }

        /* Streak Progress — bên dưới kill counter (trái) */
        #streak-progress {
            position: fixed;
            top: 68px;
            left: 30px;
            text-align: left;
        }

        #progress-text {
            display: block;
            font-size: 13px;
            color: #ffaa66;
            text-shadow: 1px 1px 0 #000;
            font-family: Arial, sans-serif;
            font-weight: normal;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* Revenge Badge */
        #revenge-badge {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        #revenge-text {
            display: block;
            font-size: 52px;
            font-weight: 900;
            color: #ff6600;
            text-shadow: 0 0 12px #ff4400, 0 0 35px #aa2200, 2px 2px 0 #000;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Server Announce */
        #server-announce {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        #announce-name {
            font-size: 28px;
            font-weight: 900;
            color: #66ccff;
            text-shadow: 0 0 10px #0088ff, 2px 2px 0 #000;
            letter-spacing: 3px;
        }

        #announce-streak {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #0088ff, 0 0 28px #0044aa, 2px 2px 0 #000;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #announce-kills {
            font-size: 18px;
            color: #99ddff;
            text-shadow: 1px 1px 0 #000;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* First Blood */
        #firstblood-badge {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        #firstblood-text {
            display: block;
            font-size: 52px;
            font-weight: 900;
            color: #ff2222;
            text-shadow: 0 0 12px #ff0000, 0 0 35px #880000, 2px 2px 0 #000;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Streak Message — top-center */
        #streak-message {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            animation: streakFade 0.5s ease-out;
        }

        #streak-name {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #streak-kills {
            font-size: 24px;
            color: #ffcc00;
            text-shadow: 0 0 8px #ff8800, 2px 2px 0 #000;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* Per-streak colors */
        .sk-killingspree #streak-name {
            color: #ffaa00;
            text-shadow: 0 0 12px #ff8800, 0 0 30px #ff6600, 2px 2px 0 #000;
        }
        .sk-rampage #streak-name {
            color: #ff6600;
            text-shadow: 0 0 12px #ff4400, 0 0 30px #cc2200, 2px 2px 0 #000;
        }
        .sk-dominating #streak-name {
            color: #ff3300;
            text-shadow: 0 0 12px #ff2200, 0 0 35px #cc0000, 2px 2px 0 #000;
        }
        .sk-unstoppable #streak-name {
            color: #cc44ff;
            text-shadow: 0 0 12px #aa00ff, 0 0 35px #6600cc, 2px 2px 0 #000;
        }
        .sk-godlike #streak-name {
            color: #ffffff;
            text-shadow: 0 0 15px #ffdd00, 0 0 40px #ffaa00, 2px 2px 0 #000;
        }

        /* Headshot Badge */
        #headshot-badge {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .headshot-icon {
            width: 64px;
            height: 64px;
            background-image: url('WebUI/images/headshot.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 8px #ff0000) drop-shadow(0 0 16px #cc0000);
        }

        /* Headshot Message */
        #headshot-message {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        #headshot-name {
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #00ccff, 0 0 28px #0066ff, 2px 2px 0 #000;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #headshot-count {
            font-size: 20px;
            color: #66eeff;
            text-shadow: 0 0 8px #0099ff, 2px 2px 0 #000;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* Multi-Kill Badge */
        #multikill-badge {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        #multikill-name {
            display: block;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .mk-double #multikill-name {
            font-size: 38px;
            color: #ffdd00;
            text-shadow: 0 0 12px #ffaa00, 0 0 30px #ff8800, 2px 2px 0 #000;
        }
        .mk-triple #multikill-name {
            font-size: 44px;
            color: #ff8800;
            text-shadow: 0 0 12px #ff6600, 0 0 35px #ff4400, 2px 2px 0 #000;
        }
        .mk-quad #multikill-name {
            font-size: 50px;
            color: #ff3300;
            text-shadow: 0 0 15px #ff2200, 0 0 40px #cc0000, 2px 2px 0 #000;
        }
        .mk-rampage #multikill-name {
            font-size: 56px;
            color: #cc44ff;
            text-shadow: 0 0 15px #aa00ff, 0 0 45px #6600cc, 2px 2px 0 #000;
        }

        /* Streak Ended */
        #streak-ended {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        #ended-text {
            font-size: 28px;
            text-shadow: 2px 2px 0 #000;
        }

        .ended-by-player #ended-text {
            color: #ff4444;
        }

        .ended-env #ended-text {
            color: #aaaaaa;
        }

        #ended-count {
            font-size: 18px;
            text-shadow: 1px 1px 0 #000;
        }

        .ended-by-player #ended-count {
            color: #ff8888;
        }

        .ended-env #ended-count {
            color: #888888;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Kill Counter -->
    <div id="kill-counter" class="hidden">
        <div id="kill-icon">KILLS</div>
        <div id="kill-number">0</div>
    </div>

    <!-- Streak Progress -->
    <div id="streak-progress" class="hidden">
        <div id="progress-text">2 kills → RAMPAGE</div>
    </div>

    <!-- Revenge Badge -->
    <div id="revenge-badge" class="hidden">
        <div id="revenge-text">REVENGE</div>
    </div>

    <!-- Server Announce -->
    <div id="server-announce" class="hidden">
        <div id="announce-name">Player123</div>
        <div id="announce-streak">is UNSTOPPABLE!</div>
        <div id="announce-kills">10 KILLS</div>
    </div>

    <!-- First Blood -->
    <div id="firstblood-badge" class="hidden">
        <div id="firstblood-text">FIRST BLOOD</div>
    </div>

    <!-- Streak Message -->
    <div id="streak-message" class="hidden">
        <div id="streak-name">KILLING SPREE</div>
        <div id="streak-kills">3 KILLS</div>
    </div>

    <!-- Headshot Badge (image) -->
    <div id="headshot-badge" class="hidden"></div>

    <!-- Headshot Message -->
    <div id="headshot-message" class="hidden">
        <div id="headshot-name">DOUBLE HEADSHOT</div>
        <div id="headshot-count">2x</div>
    </div>

    <!-- Multi-Kill Badge -->
    <div id="multikill-badge" class="hidden mk-double">
        <div id="multikill-name">DOUBLE KILL</div>
    </div>

    <!-- Streak Ended -->
    <div id="streak-ended" class="hidden">
        <div id="ended-text">Streak Ended</div>
        <div id="ended-count">15 kill streak</div>
    </div>

    <!-- Audio Elements -->
    <audio id="snd-kill_normal" preload="auto">
        <source src="WebUI/sounds/kill_normal.webm" type="audio/webm">
    </audio>
    <audio id="snd-kill_headshot" preload="auto">
        <source src="WebUI/sounds/kill_headshot.webm" type="audio/webm">
    </audio>
    <audio id="snd-headshot_double" preload="auto">
        <source src="WebUI/sounds/headshot_double.webm" type="audio/webm">
    </audio>
    <audio id="snd-headshot_triple" preload="auto">
        <source src="WebUI/sounds/headshot_triple.webm" type="audio/webm">
    </audio>
    <audio id="snd-headshot_multi" preload="auto">
        <source src="WebUI/sounds/headshot_multi.webm" type="audio/webm">
    </audio>
    <audio id="snd-streak_3" preload="auto">
        <source src="WebUI/sounds/streak_3.webm" type="audio/webm">
    </audio>
    <audio id="snd-streak_5" preload="auto">
        <source src="WebUI/sounds/streak_5.webm" type="audio/webm">
    </audio>
    <audio id="snd-streak_7" preload="auto">
        <source src="WebUI/sounds/streak_7.webm" type="audio/webm">
    </audio>
    <audio id="snd-streak_10" preload="auto">
        <source src="WebUI/sounds/streak_10.webm" type="audio/webm">
    </audio>
    <audio id="snd-streak_15" preload="auto">
        <source src="WebUI/sounds/streak_15.webm" type="audio/webm">
    </audio>
    <audio id="snd-first_blood" preload="auto">
        <source src="WebUI/sounds/first_blood.webm" type="audio/webm">
    </audio>
    <audio id="snd-revenge_kill" preload="auto">
        <source src="WebUI/sounds/revenge_kill.webm" type="audio/webm">
    </audio>
    <audio id="snd-double_kill" preload="auto">
        <source src="WebUI/sounds/double_kill.webm" type="audio/webm">
    </audio>
    <audio id="snd-triple_kill" preload="auto">
        <source src="WebUI/sounds/triple_kill.webm" type="audio/webm">
    </audio>
    <audio id="snd-quad_kill" preload="auto">
        <source src="WebUI/sounds/quad_kill.webm" type="audio/webm">
    </audio>
    <audio id="snd-rampage" preload="auto">
        <source src="WebUI/sounds/rampage.webm" type="audio/webm">
    </audio>
    <audio id="snd-unstoppable" preload="auto">
        <source src="WebUI/sounds/unstoppable.webm" type="audio/webm">
    </audio>

    <!-- Instruction Panel -->
    <div id="instruction-panel">
        <strong>KillStreak HUD Preview</strong>
        <span class="badge-new">v1.6.0</span>
        <br>Demo các UI elements. Click để preview:
        <button class="demo-button" onclick="demoKillCounter()">Kill Counter (top-left)</button>
        <button class="demo-button" onclick="demoStreak('KILLING SPREE', 'sk-killingspree', 3)">KILLING SPREE</button>
        <button class="demo-button" onclick="demoStreak('RAMPAGE', 'sk-rampage', 5)">RAMPAGE</button>
        <button class="demo-button" onclick="demoStreak('DOMINATING', 'sk-dominating', 7)">DOMINATING</button>
        <button class="demo-button" onclick="demoStreak('UNSTOPPABLE', 'sk-unstoppable', 10)">UNSTOPPABLE</button>
        <button class="demo-button" onclick="demoStreak('GODLIKE', 'sk-godlike', 15)">GODLIKE</button>
        <button class="demo-button" onclick="demoHeadshot(1)">Headshot (1 icon)</button>
        <button class="demo-button" onclick="demoHeadshot(2)">Double Headshot (2 icons)</button>
        <button class="demo-button" onclick="demoHeadshot(3)">Triple Headshot (3 icons)</button>
        <button class="demo-button" onclick="demoHeadshot(5)">Multi Headshot (5 icons)</button>
        <button class="demo-button" onclick="demoMultiKill('DOUBLE KILL', 'mk-double')">Double Kill</button>
        <button class="demo-button" onclick="demoMultiKill('TRIPLE KILL', 'mk-triple')">Triple Kill</button>
        <button class="demo-button" onclick="demoMultiKill('QUAD KILL', 'mk-quad')">Quad Kill</button>
        <button class="demo-button" onclick="demoMultiKill('RAMPAGE', 'mk-rampage')">Rampage (multi)</button>
        <button class="demo-button" onclick="demoFirstBlood()">First Blood</button>
        <button class="demo-button" onclick="demoRevenge()">Revenge</button>
        <button class="demo-button" onclick="demoServerAnnounce()">Server Announce</button>
        <button class="demo-button" onclick="demoStreakEndedEnv()">Streak Ended (env)</button>
        <button class="demo-button" onclick="demoStreakEndedPlayer()">Streak Ended (player)</button>
        <button class="demo-button" onclick="clearAll()">Clear All</button>
    </div>

    <script>
        function playSound(soundName) {
            var audio = document.getElementById('snd-' + soundName);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) {});
            }
        }

        function demoKillCounter() {
            playSound('kill_normal');
            var counter = document.getElementById('kill-counter');
            var number = document.getElementById('kill-number');
            number.textContent = '5';
            counter.classList.remove('hidden');
            setTimeout(function() { counter.classList.add('hidden'); }, 5000);
        }

        function demoStreak(name, cssClass, kills) {
            playSound('kill_normal');
            setTimeout(function() { playSound('streak_' + kills); }, 300);
            var el = document.getElementById('streak-message');
            var nameEl = document.getElementById('streak-name');
            var killsEl = document.getElementById('streak-kills');
            nameEl.textContent = name;
            killsEl.textContent = kills + ' KILLS';
            el.className = 'hidden';
            if (cssClass) el.classList.add(cssClass);
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 3000);
        }

        function demoHeadshot(count) {
            count = count || 1;
            playSound('kill_headshot');
            var badge = document.getElementById('headshot-badge');
            badge.innerHTML = '';
            for (var i = 0; i < count; i++) {
                var icon = document.createElement('div');
                icon.className = 'headshot-icon';
                badge.appendChild(icon);
            }
            badge.classList.remove('hidden');
            setTimeout(function() { badge.classList.add('hidden'); }, 1500);
        }

        function demoMultiKill(name, cssClass) {
            playSound('kill_normal');
            setTimeout(function() { playSound('double_kill'); }, 300);
            var el = document.getElementById('multikill-badge');
            var nameEl = document.getElementById('multikill-name');
            nameEl.textContent = name;
            el.className = 'hidden';
            el.classList.add(cssClass);
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 3000);
        }

        function demoFirstBlood() {
            playSound('first_blood');
            var el = document.getElementById('firstblood-badge');
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 3000);
        }

        function demoRevenge() {
            playSound('revenge_kill');
            var el = document.getElementById('revenge-badge');
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 3000);
        }

        function demoServerAnnounce() {
            playSound('streak_5');
            var el = document.getElementById('server-announce');
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 3000);
        }

        function demoStreakEndedEnv() {
            var el = document.getElementById('streak-ended');
            var textEl = document.getElementById('ended-text');
            var countEl = document.getElementById('ended-count');
            textEl.textContent = 'Streak Ended';
            countEl.textContent = '15 kill streak';
            el.className = 'hidden';
            el.classList.add('ended-env');
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 2000);
        }

        function demoStreakEndedPlayer() {
            var el = document.getElementById('streak-ended');
            var textEl = document.getElementById('ended-text');
            var countEl = document.getElementById('ended-count');
            textEl.textContent = 'Streak Ended';
            countEl.textContent = 'by KillerName (10 kills)';
            el.className = 'hidden';
            el.classList.add('ended-by-player');
            el.classList.remove('hidden');
            setTimeout(function() { el.classList.add('hidden'); }, 2000);
        }

        function clearAll() {
            document.querySelectorAll('audio').forEach(function(audio) {
                audio.pause();
                audio.currentTime = 0;
            });
            document.querySelectorAll('[id$="-badge"], [id$="-message"], [id$="-counter"], [id$="-progress"], [id$="-announce"], [id$="-ended"]').forEach(function(el) {
                el.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
