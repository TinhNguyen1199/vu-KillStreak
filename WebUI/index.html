<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>KillStreak HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TEST: div này luôn hiển thị, không cần JS — nếu thấy thì WebUI render được -->
    <div id="webui-test" style="position:fixed; top:10px; left:10px; background:#ff0000; color:#ffffff; font-size:28px; padding:8px 16px; z-index:9999;">KS:OK</div>

    <!-- Âm thanh: dùng <video> vì Gameface không hỗ trợ <audio> hay Web Audio API -->
    <!-- File phải là .webm (convert từ .wav bằng ffmpeg) -->
    <video id="snd-kill_normal"     src="sounds/kill_normal.webm"     preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-kill_headshot"   src="sounds/kill_headshot.webm"   preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-headshot_double" src="sounds/headshot_double.webm" preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-headshot_triple" src="sounds/headshot_triple.webm" preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-headshot_multi"  src="sounds/headshot_multi.webm"  preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-streak_3"        src="sounds/streak_3.webm"        preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-streak_5"        src="sounds/streak_5.webm"        preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-streak_7"        src="sounds/streak_7.webm"        preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-streak_10"       src="sounds/streak_10.webm"       preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-streak_15"       src="sounds/streak_15.webm"       preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-first_blood"    src="sounds/first_blood.webm"     preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-revenge_kill"   src="sounds/revenge_kill.webm"   preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-double_kill"    src="sounds/double_kill.webm"    preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-triple_kill"    src="sounds/triple_kill.webm"    preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-quad_kill"      src="sounds/quad_kill.webm"      preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-rampage"        src="sounds/rampage.webm"        preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-unstoppable"    src="sounds/unstoppable.webm"    preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-shut_down"      src="sounds/shut_down.webm"      preload="auto" style="display:none;position:absolute;"></video>
    <video id="snd-dead"           src="sounds/dead.webm"           preload="auto" style="display:none;position:absolute;"></video>

    <!-- Hiển thị số kill streak góc trên phải -->
    <div id="kill-counter" class="hidden">
        <div id="kill-icon">KILLS</div>
        <div id="kill-number">0</div>
    </div>

    <!-- Streak progress — bên dưới kill counter -->
    <div id="streak-progress" class="hidden">
        <div id="progress-text"></div>
    </div>

    <!-- Revenge badge -->
    <div id="revenge-badge" class="hidden">
        <div id="revenge-text">REVENGE</div>
    </div>

    <!-- Server Announce — streak của người khác -->
    <div id="server-announce" class="hidden">
        <div id="announce-name"></div>
        <div id="announce-streak"></div>
        <div id="announce-kills"></div>
    </div>

    <!-- First Blood badge -->
    <div id="firstblood-badge" class="hidden">
        <div id="firstblood-text">FIRST BLOOD</div>
    </div>

    <!-- Thông báo streak lớn ở giữa màn hình -->
    <div id="streak-message" class="hidden">
        <div id="streak-name">KILLING SPREE</div>
        <div id="streak-kills">3 KILLS</div>
    </div>

    <!-- Badge headshot đơn — hiện mỗi khi có headshot kill -->
    <div id="headshot-badge" class="hidden">
        <div id="headshot-badge-text">HEADSHOT</div>
    </div>

    <!-- Thông báo headshot liên tiếp -->
    <div id="headshot-message" class="hidden">
        <div id="headshot-name">DOUBLE HEADSHOT</div>
        <div id="headshot-count">2x</div>
    </div>

    <!-- Badge multi-kill (Double Kill / Triple Kill / ...) -->
    <div id="multikill-badge" class="hidden">
        <div id="multikill-count">2x</div>
        <div id="multikill-name">DOUBLE KILL</div>
    </div>

    <!-- Thông báo streak kết thúc (với killer name) -->
    <div id="streak-ended" class="hidden">
        <div id="ended-text">Streak Ended</div>
        <div id="ended-count">15 kill streak</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
